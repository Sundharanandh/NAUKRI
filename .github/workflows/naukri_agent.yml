name: Job links and Excel digest

on:
  schedule:
    # UTC -> 09:00, 14:00 and 19:00 Asia/Kolkata.
    # GitHub scheduled jobs may be delayed; these are target times.
    - cron: '30 3,8,13 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional run note (kept for compatibility with the dashboard)'
        required: false
        default: 'Manual review'
      delivery:
        description: 'Preview builds Excel without emailing or reserving links'
        type: choice
        options:
          - preview
          - send
        default: preview

permissions:
  contents: write

concurrency:
  group: job-digest-history
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOB_MAILER_STATE_DIR: ${{ runner.temp }}/job-digest-state
      JOB_MAILER_CONFIG: ${{ github.workspace }}/digest_config.json
      JOB_MAILER_CHECKPOINT: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      DIGEST_EMAIL_TO: ${{ vars.DIGEST_EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      JOB_ALERT_LABEL: ${{ vars.JOB_ALERT_LABEL || 'JobAlerts' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install digest dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Restore persistent email history
        id: restore
        run: python persist_digest_state.py restore

      - name: Collect jobs, update Excel and prepare or send digest
        env:
          DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery || 'send' }}
        run: |
          if [ "$DELIVERY_MODE" = 'preview' ]; then
            python digest_agent.py --preview
          else
            python digest_agent.py
          fi

      - name: Save state even if delivery failed
        if: always() && steps.restore.outcome == 'success'
        run: python persist_digest_state.py save

      - name: Attach Excel and diagnostics to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ env.JOB_MAILER_STATE_DIR }}/Job_Tracker*.xlsx
            ${{ env.JOB_MAILER_STATE_DIR }}/run_summary.json
            ${{ env.JOB_MAILER_STATE_DIR }}/Email_Preview.txt
            ${{ env.JOB_MAILER_STATE_DIR }}/job_mailer.log
          retention-days: 30
          if-no-files-found: warn
